        <div class="brand">
            <img src="images/ridwan.jpg" alt="Foto Ridwan" class="avatar" />
            <div>

                <p class="muted">Hubungi Saya</p>

<main class="container">

<section class="contact-card">
    <h2>Form Kontak</h2>

    <form id="contactForm">
        <label>Nama</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Pesan</label>
        <textarea name="message" rows="5" required></textarea>

        <button class="btn" type="submit">Kirim</button>
    </form>

</section>

</main>

<footer class="site-footer">
    <div class="container">
        <p>© <span id="year"></span> Ridwan Parid. Semua hak cipta dilindungi.</p>
    </div>
